<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Number Program Lab</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #111;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #c4c4c4;
      padding: 20px;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
      text-align: center;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      margin: 10px 0 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type='number'] {
      width: 100%;
      padding: 10px;
      border: 1px solid #999;
      border-radius: 4px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1 1 48%;
      padding: 10px;
      border: 1px solid #666;
      background: #ddd;
      color: #111;
      font-size: 15px;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background: #ccc;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #999;
      background: #f9f9f9;
      min-height: 80px;
      font-size: 15px;
      line-height: 1.6;
    }

    .buttons {
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Number Program Lab</h1>
    <p>Enter a number and click one of the buttons to run the program.</p>

    <label for="userNumber">Number</label>
    <input id="userNumber" type="number" placeholder="Enter a number" />

    <div class="buttons">
      <button onclick="runEvenOdd()">Even or Odd</button>
      <button onclick="runPrimeCheck()">Prime or Not</button>
      <button onclick="runFactorial()">Factorial</button>
      <button onclick="runArmstrong()">Armstrong</button>
    </div>

    <div id="result">Output will appear here.</div>
  </div>

  <script>
    function getNumber() {
      const element = document.getElementById('userNumber');
      const value = Number(element.value);
      if (element.value.trim() === '') {
        return { valid: false, message: 'Please enter a number.' };
      }
      if (!Number.isFinite(value)) {
        return { valid: false, message: 'Enter a valid number.' };
      }
      if (!Number.isInteger(value)) {
        return { valid: false, message: 'Please enter a whole number.' };
      }
      return { valid: true, value };
    }

    function setResult(message) {
      document.getElementById('result').innerHTML = message;
    }

    function runEvenOdd() {
      const check = getNumber();
      if (!check.valid) {
        return setResult(check.message);
      }
      const num = check.value;
      const parity = num % 2 === 0 ? 'even' : 'odd';
      setResult('The number ' + num + ' is ' + parity + '.');
    }

    function runPrimeCheck() {
      const check = getNumber();
      if (!check.valid) {
        return setResult(check.message);
      }
      const num = check.value;
      if (num < 2) {
        return setResult('The number ' + num + ' is not prime.');
      }
      let isPrime = true;
      for (let i = 2; i <= Math.sqrt(num); i++) {
        if (num % i === 0) {
          isPrime = false;
          break;
        }
      }
      if (isPrime) {
        setResult('Yes, ' + num + ' is a prime number.');
      } else {
        setResult('No, ' + num + ' is not a prime number.');
      }
    }

    function runFactorial() {
      const check = getNumber();
      if (!check.valid) {
        return setResult(check.message);
      }
      const num = check.value;
      if (num < 0) {
        return setResult('Factorial is not defined for negative numbers.');
      }
      let factorial = 1;
      for (let i = 1; i <= num; i++) {
        factorial *= i;
      }
      setResult('Factorial of ' + num + ' is ' + factorial + '.');
    }

    function runArmstrong() {
      const check = getNumber();
      if (!check.valid) {
        return setResult(check.message);
      }
      const num = check.value;
      const digits = String(Math.abs(num)).split('');
      const power = digits.length;
      let sum = 0;
      for (let i = 0; i < digits.length; i++) {
        sum += Math.pow(Number(digits[i]), power);
      }
      if (sum === Math.abs(num)) {
        setResult('Yes, ' + num + ' is an Armstrong number.');
      } else {
        setResult('No, ' + num + ' is not an Armstrong number.');
      }
    }
  </script>
</body>
</html>
