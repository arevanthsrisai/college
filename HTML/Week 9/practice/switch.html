<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
</head>
<body>
    <script>
        function getGrade(){
            const input = document.getElementById("percentage").value();
            if(input === ""){
                document.getElementById("output").innerText = "Please enter a number";
                return;
            }
            const percentage = Number(input);
            let result = "";
            switch (true) {
                case (percentage >= 90):
                    result = "Grade: A";
                    break;
                case (percentage >= 80):
                    result = "Grade: B";
                    break;
                case (percentage >= 70):
                    result = "Grade: C";
                    break;
                case (percentage >= 60):
                    result = "Grade: D";
                    break;
                default:
                    result = "Grade: F";
            }
            document.getElementById("output").innerText = result;
        }
    </script>
    
    <input type="text" id="percentage" placeholder="Enter percentage">
    <button type="button" onclick="getGrade()">Evaluate</button>
    <p id="output"></p>
</body>
</html>
