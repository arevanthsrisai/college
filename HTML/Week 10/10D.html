<!DOCTYPE html>
<html>
<head>
    <title>Odd or Even (0 to 15)</title>
</head>
<body>

    <h2>Check Odd or Even (0–15)</h2>

    <button onclick="checkNumbers()">Run</button>

    <p id="result"></p>

    <script>
        function checkNumbers() {
            let output = "";

            for (let i = 0; i <= 15; i++) {
                if (i % 2 === 0) {
                    output += i + " is Even<br>";
                } else {
                    output += i + " is Odd<br>";
                }
            }

            document.getElementById("result").innerHTML = output;
        }
    </script>

</body>
</html>
