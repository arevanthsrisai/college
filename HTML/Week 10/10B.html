<!DOCTYPE html>
<html>
<head>
    <title>Sort Three Numbers</title>
</head>
<body>

    <h2>Sort Three Numbers</h2>

    <label>Enter first number:</label>
    <input type="number" id="num1"><br><br>

    <label>Enter second number:</label>
    <input type="number" id="num2"><br><br>

    <label>Enter third number:</label>
    <input type="number" id="num3"><br><br>

    <button onclick="sortNumbers()">Sort Numbers</button>

    <script>
        function sortNumbers() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            let c = Number(document.getElementById("num3").value);

            let temp;

            // Sorting using conditional statements (ascending order)
            if (a > b) {
                temp = a;
                a = b;
                b = temp;
            }

            if (a > c) {
                temp = a;
                a = c;
                c = temp;
            }

            if (b > c) {
                temp = b;
                b = c;
                c = temp;
            }

            alert("Sorted order: " + a + ", " + b + ", " + c);
        }
    </script>

</body>
</html>
