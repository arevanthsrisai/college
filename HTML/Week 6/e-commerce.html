<!DOCTYPE html>
<html>
<head>
    <title>E-commerce Website</title>

    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            background: white;
        }

        .container{
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            grid-template-columns:200px 1fr;
            grid-template-areas: 
            "header header"
            "sale sale"
            "sidebar products"
            "footer footer";
            gap: 10px;
            width: 100%;
            min-height: 100vh;
        }
        
        .header{
            grid-area: header;
            background: green;
            color:white;
            text-align:center;
            padding:15px;
        }
        
        .sale{
            grid-area: sale;
            background: lightpink;
            color: black;
            text-align:left;
        }

        .sidebar{
            grid-area: sidebar;
            background: #f4f4f4;
            padding: 20px;
            border-radius: 10px;
        }

        .product-list{
            grid-area: products;
            display: flex;
            background: whitesmoke;
            padding: 20px;
            gap: 30px;
            flex-wrap: wrap;
        }

        .product {
            background-color: white;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.3);
            text-align: center;
            padding: 20px;
            height: 280px;
        }

        .footer{
            grid-area: footer;
            background: #333;
            color:white;
            text-align:center;
            padding:15px;
       }

       button{
            margin-top: 10px;
            padding: 8px 15px;
            border: none;
            background-color:blue;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: darkblue;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Value E-commerce</h1>
        </div>

        <div class="sale">
            <marquee behavior="scroll" direction="right" scrollamount="25"><h1>Summer Sale - Up to 50% Off!</h1></marquee>
        </div>

        <div class="sidebar">
            <h3>Categories</h3>
            <p>electronics</p>
            <p>fashion</p>
            <p>home & kitchen</p>
            <p>books</p>
        </div>

    
        <div class="product-list">
            <div class="product">
                <img src="bag.png" alt="Product 1" height="100px" width="150px">
                <h2>Eco-Friendly Tote Bag</h2>
                <p style="text-decoration: line-through;">$24.99</p>
                <p>$19.67</p>
                <button>Add to Cart</button>
            </div>
            <div class="product">
                <img src="ear.png" alt="Product 2" height="100px" width="100px">
                <h2>Wireless Earbuds</h2>
                <p style="text-decoration: line-through;">$59.99</p>
                <p>$49.99</p>
                <button>Add to Cart</button>
            </div>
        
            <div class="product">
                <img src="bottle.png" alt="Product 3" height="100px" width="80px">
                <h2>Stainless Steel Water Bottle</h2>
                <p style="text-decoration: line-through;">$39.99</p>
                <p>$24.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product">
                <img src="mat.png" alt="Product 4" height="100px" width="150px">
                <h2>Yoga Mat</h2>
                <p style="text-decoration: line-through;">$59.99</p>
                <p>$29.99</p>
                <button>Add to Cart</button>
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2024 Value E-commerce. All rights reserved.</p>
        </div>
    </div>
</html>
