<!DOCTYPE html>
<html>
    <head>
        <style>
        body{
            margin:0;
            background: whitesmoke;
        }
        .container{
            display: flex;
            padding: 20px;
            gap: 30px;
            flex-wrap: wrap;

        }
        .product {
            background-color: white;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.3);
            text-align: center;
            padding: 20px;
            height: fit-content;
            size: 100%;
        }
        
       button{
            margin-top: 10px;
            padding: 8px 15px;
            border: none;
            background-color:blue;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: darkblue;
        }

        </style>
    </head>
    <body>
        <div class="container">
            <div class="product">
                <img src="phone.png" alt="Product 1" height="100px" width="70px">
                <h2>Smartphone</h2>
                <p style="text-decoration: line-through; color: lightslategrey;">$199.99</p>
                <p>$149.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product">
                <img src="ear.png" alt="Product 2" height="100px" width="100px">
                <h2>Wireless Earbuds</h2>
                <p style="text-decoration: line-through; color: lightslategrey;">$59.99</p>
                <p>$49.99</p>
                <button>Add to Cart</button>
            </div>
        
            <div class="product">
                <img src="earphones.png" alt="Product 3" height="100px" width="80px">
                <h2>Earphones</h2>
                <p style="text-decoration: line-through; color: lightslategrey;">$39.99</p>
                <p>$24.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product">
                <img src="laptop.png" alt="Product 4" height="100px" width="150px">
                <h2>Laptop</h2>
                <p style="text-decoration: line-through; color: lightslategrey;">$999.99</p>
                <p>$799.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product">
                <img src="charger.png" alt="Product 5" height="100px" width="130px">
                <h2>USB Charger</h2>
                <p style="text-decoration: line-through; color: lightslategrey;">$49.99</p>
                <p>$24.99</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </body>
</html>
