<!DOCTYPE html>
<html>

<head>
    <title>Email Validation</title>
    <style>
        body {
            font-family: Arial;
            background: #eef;
            text-align: center;
        }

        .container {
            margin-top: 100px;
            background: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
        }

        input,
        button {
            padding: 10px;
            width: 90%;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Email Validation</h2>
        <form onsubmit="return validateEmail(event)">
            <input type="text" id="email" placeholder="Enter Email">
            <button type="button" onclick="validateEmail(event)">Submit</button>
            <p id="msg"></p>
        </form>
    </div>

    <script>
        function validateEmail(event) {
            let email = document.getElementById("email").value;
            let msg = document.getElementById("msg");
            let pattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

            if (!email || email.trim() === "") {
                msg.innerText = "Email is required";
                msg.style.color = "red";
                event.preventDefault();
                return false;
            }

            if (!email.match(pattern)) {
                msg.innerText = "Invalid Email Format";
                msg.style.color = "red";
                event.preventDefault();
                return false;
            }

            msg.innerText = "Valid Email";
            msg.style.color = "green";
            return true;
        }
    </script>

</body>

</html>
