<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>
</head>
<body style="text-align: center;">
    <h1>User Registration</h1>
    <form>
      <table border="1px" align="center" cellpadding="10px" cellspacing="0px" style="text-align: left;">
        <tr>
          <td><label for="name">Name:</label></td>
          <td><input type="text" id="name" name="name" placeholder="Enter your name" required></td>
        </tr>
        <tr>
          <td><label for="email">Email:</label></td>
          <td><input type="email" id="email" name="email" placeholder="Enter your email" required></td>
        </tr>
        <tr>
          <td><label for="password">Password:</label></td>
          <td><input type="password" id="password" name="password" placeholder="Enter your password"></td>
        </tr>
        <tr>
          <td><label for="phone">Phone:</label></td>
          <td><input type="tel" id="phone" name="phone" placeholder="Enter your phone number"></td>
        </tr>
        <tr>
            <td colspan="2" style="text-align: center;">
                <input type="submit" value="Register">
                <input type="reset" value="Reset">
            </td>
        </tr>
      </table>
    </form>
</html>
