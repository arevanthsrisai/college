<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
</head>
<body style="text-align: center;">
    <h1>User Login</h1>
    <form>
      <table border="1px" align="center" cellpadding="10px" cellspacing="0px" style="text-align: left;">
        <tr>
          <td><label for="username">Username:</label></td>
          <td><input type="text" id="username" name="username" placeholder="Enter your username" required></td>
        </tr>
        <tr>
          <td><label for="password">Password:</label></td>
          <td><input type="password" id="password" name="password" placeholder="Enter your password"></td>
        </tr>
        <tr>
          <td colspan="2" style="text-align: center;"><input type="submit" value="Login"></td>
        </tr>
      </table>
    </form>
</html>
