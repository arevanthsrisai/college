<!DOCTYPE html>
<html>
<head>
    <title>sq animation</title>
    <style>
        @keyframes rotate {
            from {transform: rotate(0deg);}
            to {transform: rotate(360deg);}
        }
    </style>
</head>
<body>
    <svg width="150" height="150"  style="animation: rotate 2s linear infinite; margin: 50px;">
        <rect width="150" height="150" fill="red"></rect>
    </svg>
</body>
</html>
