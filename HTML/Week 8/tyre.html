<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <style>
        #ball {
            width: 300px;
            height: 300px;
            margin-top: 100px;
            animation: tyre 2s linear infinite;
        }
        @keyframes tyre {
            from {transform: translate(0) rotate(0deg);}
            to {transform: translate(900px) rotate(360deg);}
        }
    </style>
</head>
<body>
    <img id="ball" src="tyre.jpg" alt="tyre">
</body>
</html>
